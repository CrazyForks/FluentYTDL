name: CI

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  PYTHONIOENCODING: "utf-8"

jobs:
  lint:
    name: Lint and version consistency
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Check version consistency
        run: python scripts/version_manager.py check

      - name: Run Ruff
        run: ruff check src tests

      - name: Check Ruff formatting
        run: ruff format --check src tests
        continue-on-error: true

  typecheck:
    name: Pyright (advisory)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Run Pyright without blocking the build
        run: pyright src
        continue-on-error: true

  test:
    name: Tests (Windows, Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Run test suite
        run: pytest tests -q --tb=short

  build-check:
    name: PyInstaller analysis (Windows)
    runs-on: windows-latest
    needs: [lint, test]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Verify PyInstaller configuration
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -c "
          import PyInstaller.__main__
          print('PyInstaller is available')
          PyInstaller.__main__.run([
              'scripts/FluentYTDL.spec',
              '--noconfirm',
              '--log-level', 'WARN',
              '--workpath', 'build',
              '--distpath', 'dist',
          ])
          print('PyInstaller analysis completed')
          "
